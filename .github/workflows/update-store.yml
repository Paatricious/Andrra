name: Update store

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'sources.json'
      - 'scripts/**'
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow==12.2.0
      - name: Run pipeline
        run: |
          cd scripts
          python convert.py pull --limit 20
          python convert.py convert
          python -m unittest test_convert.py -v
          cd pullers && python -m unittest test_wikimedia.py -v
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update store: $(date +%Y-%m-%d)"
          git push
